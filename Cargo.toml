[package]
name = "agent-runtime"
version = "0.2.0"
edition = "2024"

[features]
default = ["reqwest-http"]
reqwest-http = ["dep:reqwest"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Cross-target time (uses std on native, JS Date on wasm32-unknown-unknown).
web-time = "1"
# Default HTTP backend for native targets. wasm consumers turn this off and
# plug in their own HttpClient impl (e.g. one backed by `worker::Fetch`).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
